name: CD

on:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  DOCKER_REPO_PATH: ${{ secrets.DOCKER_USERNAME }}/tally
  DOCKER_GATEWAY_REPO_PATH: ${{ secrets.DOCKER_USERNAME }}/tally-gateway
  OTEL_EXPORTER_OTLP_ENDPOINT: "https://api.honeycomb.io"
  OTEL_EXPORTER_OTLP_PROTOCOL: "http/protobuf"
  OTEL_SERVICE_NAME: "cd"

jobs:
  semver_tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tagger.outputs.next }}
      is_released: ${{ steps.tagger.outputs.next != steps.tagger.outputs.current }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - id: tagger
        uses: ietf-tools/semver-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          noVersionBumpBehavior: current

      - if: steps.tagger.outputs.next != steps.tagger.outputs.current
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tagger.outputs.next }}
          generate_release_notes: true

  build_push:
    runs-on: ubuntu-latest
    needs: [semver_tag]
    if: needs.semver_tag.outputs.is_released == 'true'
    outputs:
      image_tag: ${{ needs.semver_tag.outputs.new_tag }}
    env:
      OTEL_EXPORTER_OTLP_HEADERS: "x-honeycomb-team=${{ secrets.HONEYCOMB_API_KEY }}"
    steps:
      - uses: actions/checkout@v4

      - name: Install otel-cli
        run: |
          curl -sL https://github.com/equinix-labs/otel-cli/releases/download/v0.4.5/otel-cli_0.4.5_linux_amd64.deb -o otel-cli.deb
          sudo dpkg -i otel-cli.deb
          TRACE_ID=$(echo -n "$GITHUB_RUN_ID" | md5sum | cut -c1-32)
          echo "TRACE_ID=$TRACE_ID" >> "$GITHUB_ENV"

      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build tally
        run: |
          otel-cli exec \
            --name docker-build-tally \
            --force-trace-id $TRACE_ID \
            --attrs "service=tally,github.repository=$GITHUB_REPOSITORY,github.run_id=$GITHUB_RUN_ID,github.sha=$GITHUB_SHA,job=build_push,image_tag=${{ needs.semver_tag.outputs.new_tag }}" \
            -- docker buildx build \
              --tag ${{ env.DOCKER_REPO_PATH }}:${{ needs.semver_tag.outputs.new_tag }} \
              --tag ${{ env.DOCKER_REPO_PATH }}:latest \
              .

      - name: Build gateway
        run: |
          otel-cli exec \
            --name docker-build-gateway \
            --force-trace-id $TRACE_ID \
            --attrs "service=tally-gateway,github.repository=$GITHUB_REPOSITORY,github.run_id=$GITHUB_RUN_ID,github.sha=$GITHUB_SHA,job=build_push,image_tag=${{ needs.semver_tag.outputs.new_tag }}" \
            -- docker buildx build \
              --tag ${{ env.DOCKER_GATEWAY_REPO_PATH }}:${{ needs.semver_tag.outputs.new_tag }} \
              --tag ${{ env.DOCKER_GATEWAY_REPO_PATH }}:latest \
              -f Dockerfile.gateway \
              .

      - name: Push tally
        run: |
          otel-cli exec \
            --name docker-push-tally \
            --force-trace-id $TRACE_ID \
            --attrs "service=tally,github.repository=$GITHUB_REPOSITORY,github.run_id=$GITHUB_RUN_ID,github.sha=$GITHUB_SHA,job=build_push,image_tag=${{ needs.semver_tag.outputs.new_tag }}" \
            -- bash -c '
            docker push ${{ env.DOCKER_REPO_PATH }}:${{ needs.semver_tag.outputs.new_tag }} &&
            docker push ${{ env.DOCKER_REPO_PATH }}:latest
          '

      - name: Push gateway
        run: |
          otel-cli exec \
            --name docker-push-gateway \
            --force-trace-id $TRACE_ID \
            --attrs "service=tally-gateway,github.repository=$GITHUB_REPOSITORY,github.run_id=$GITHUB_RUN_ID,github.sha=$GITHUB_SHA,job=build_push,image_tag=${{ needs.semver_tag.outputs.new_tag }}" \
            -- bash -c '
            docker push ${{ env.DOCKER_GATEWAY_REPO_PATH }}:${{ needs.semver_tag.outputs.new_tag }} &&
            docker push ${{ env.DOCKER_GATEWAY_REPO_PATH }}:latest
          '
